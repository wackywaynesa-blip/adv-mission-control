<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ADV Mission Control</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: #0b0f19;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* Top Minimal Status Bar */
  .top-status {
    height: 32px;
    background: #111827;
    border-bottom: 1px solid #1f2937;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 12px;
    font-size: 0.75rem;
  }
  .gps-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
  }
  .led {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ef4444;
    box-shadow: 0 0 6px #ef4444;
  }
  .led.locked {
    background: #22c55e;
    box-shadow: 0 0 6px #22c55e;
  }

  /* Tab Content Area */
  .tab-content {
    flex: 1;
    display: none;
    padding: 8px;
    gap: 8px;
    overflow: hidden;
  }
  .tab-content.active {
    display: grid;
  }

  #hud-tab {
    grid-template-columns: 1.2fr 1fr;
  }

  #settings-tab, #history-tab {
    display: none;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
  }
  #settings-tab.active, #history-tab.active {
    display: flex;
  }

  /* Dashboard Cards */
  .card {
    background: #161e2d;
    border: 1px solid #1f2937;
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .card-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #9ca3af;
    margin-bottom: 4px;
  }

  /* Left Column Metrics */
  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 6px;
  }
  .metric-box {
    background: #111827;
    padding: 8px;
    border-radius: 6px;
    text-align: center;
  }
  .metric-val {
    font-size: 1.1rem;
    font-weight: 700;
    color: #38bdf8;
  }
  .metric-lbl {
    font-size: 0.65rem;
    color: #9ca3af;
  }

  /* Pace Meter Widget */
  .pace-box {
    background: #111827;
    border-radius: 6px;
    padding: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .pace-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    font-weight: bold;
  }
  .pace-arrow {
    font-size: 1.2rem;
  }

  /* Right Column: Altitude & Weather */
  .alt-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    margin-bottom: 8px;
  }
  .alt-item {
    background: #111827;
    padding: 6px 8px;
    border-radius: 6px;
  }
  .alt-val {
    font-size: 0.95rem;
    font-weight: bold;
    color: #fbbf24;
  }

  .weather-box {
    background: #111827;
    border-radius: 6px;
    padding: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
  }

  /* Bottom Navigation Bar */
  .nav-bar {
    height: 48px;
    background: #111827;
    border-top: 1px solid #1f2937;
    display: flex;
  }
  .nav-btn {
    flex: 1;
    background: none;
    border: none;
    color: #9ca3af;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 2px;
  }
  .nav-btn.active {
    color: #38bdf8;
    background: #1f2937;
  }

  /* Settings Controls */
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .input-group label {
    font-size: 0.8rem;
    color: #9ca3af;
  }
  .input-group input {
    background: #111827;
    border: 1px solid #374151;
    color: #fff;
    padding: 8px;
    border-radius: 6px;
    font-size: 1rem;
  }
  .action-btn {
    background: #2563eb;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
  }
  .action-btn:active { background: #1d4ed8; }
</style>
</head>
<body>

  <!-- Top Minimal Status Bar -->
  <div class="top-status">
    <div class="gps-pill">
      <div id="gps-led" class="led"></div>
      <span id="gps-status-text">SEARCHING GPS</span>
      <span id="gps-accuracy" style="color: #9ca3af;">(—)</span>
    </div>
    <div id="battery-status" style="color: #9ca3af;">BAT: —</div>
  </div>

  <!-- Tab 1: HUD (Main Screen) -->
  <div id="hud-tab" class="tab-content active">
    <!-- Left Card: Averages & Pace Meter -->
    <div class="card">
      <div>
        <div class="card-title">Trip Averages & Pace</div>
        <div class="metrics-grid">
          <div class="metric-box">
            <div id="moving-avg" class="metric-val">0.0</div>
            <div class="metric-lbl">MOVING AVG (KM/H)</div>
          </div>
          <div class="metric-box">
            <div id="overall-avg" class="metric-val">0.0</div>
            <div class="metric-lbl">OVERALL AVG (KM/H)</div>
          </div>
        </div>
      </div>
      <div class="pace-box">
        <span style="font-size: 0.75rem; color: #9ca3af;">PACE (TARGET: <span id="lbl-target">100</span>)</span>
        <div id="pace-display" class="pace-indicator" style="color: #9ca3af;">
          <span id="pace-arrow" class="pace-arrow">—</span>
          <span id="pace-text">IDLE</span>
        </div>
      </div>
    </div>

    <!-- Right Card: Altitude & Weather -->
    <div class="card">
      <div>
        <div class="card-title">Altitude Tracking</div>
        <div class="alt-stats">
          <div class="alt-item">
            <div style="font-size: 0.65rem; color: #9ca3af;">CURR</div>
            <div id="alt-curr" class="alt-val">— m</div>
          </div>
          <div class="alt-item">
            <div style="font-size: 0.65rem; color: #9ca3af;">GAIN</div>
            <div id="alt-gain" class="alt-val">0 m</div>
          </div>
          <div class="alt-item">
            <div style="font-size: 0.65rem; color: #9ca3af;">MIN</div>
            <div id="alt-min" class="alt-val">— m</div>
          </div>
          <div class="alt-item">
            <div style="font-size: 0.65rem; color: #9ca3af;">MAX</div>
            <div id="alt-max" class="alt-val">— m</div>
          </div>
        </div>
      </div>
      <div>
        <div class="card-title">Live Weather</div>
        <div class="weather-box">
          <span id="weather-desc">Fetching weather...</span>
          <span id="weather-temp" style="font-weight: bold; color: #38bdf8;">—°C</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab 2: Settings -->
  <div id="settings-tab" class="tab-content">
    <div class="input-group">
      <label>Target Pace Speed (KM/H)</label>
      <input type="number" id="target-speed-input" value="100" />
    </div>
    <button class="action-btn" onclick="saveSettings()">Save Target Pace</button>
  </div>

  <!-- Tab 3: History & Export -->
  <div id="history-tab" class="tab-content">
    <div class="card-title">GPX Track Logging</div>
    <div style="font-size: 0.85rem; color: #9ca3af;" id="log-count">Recorded Points: 0</div>
    <button class="action-btn" onclick="exportGPX()">Download GPX Track</button>
    <button class="action-btn" style="background: #374151;" onclick="clearLogs()">Clear Log Buffer</button>
  </div>

  <!-- Bottom Navigation Bar -->
  <div class="nav-bar">
    <button class="nav-btn active" onclick="switchTab('hud-tab', this)">HUD</button>
    <button class="nav-btn" onclick="switchTab('settings-tab', this)">Settings</button>
    <button class="nav-btn" onclick="switchTab('history-tab', this)">History</button>
  </div>

<script>
  let targetSpeed = 100;
  let gpxPoints = [];
  let minAlt = null, maxAlt = null, totalGain = 0, lastAlt = null;
  let speedBuffer = [];

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }

  function saveSettings() {
    const val = parseFloat(document.getElementById('target-speed-input').value);
    if (!isNaN(val)) {
      targetSpeed = val;
      document.getElementById('lbl-target').innerText = targetSpeed;
      alert("Target pace updated to " + targetSpeed + " KM/H");
    }
  }

  // Battery Status API
  if (navigator.getBattery) {
    navigator.getBattery().then(battery => {
      function updateBattery() {
        const pct = Math.round(battery.level * 100);
        document.getElementById('battery-status').innerText = `BAT: ${pct}%${battery.charging ? ' ⚡' : ''}`;
      }
      updateBattery();
      battery.addEventListener('levelchange', updateBattery);
      battery.addEventListener('chargingchange', updateBattery);
    });
  }

  // Weather Fetcher via Open-Meteo
  function fetchWeather(lat, lon) {
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
      .then(res => res.json())
      .then(data => {
        if (data.current_weather) {
          document.getElementById('weather-temp').innerText = data.current_weather.temperature + '°C';
          document.getElementById('weather-desc').innerText = getWeatherCondition(data.current_weather.weathercode);
        }
      })
      .catch(() => {
        document.getElementById('weather-desc').innerText = "Weather unavailable";
      });
  }

  function getWeatherCode(code) { return "Clear / Fair"; } // simplified representation

  // Geolocation & Logging Loop (1 Hz)
  const geoOptions = { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 };
  let weatherFetched = false;

  navigator.geolocation.watchPosition(pos => {
    const coords = pos.coords;
    const speedKmh = coords.speed !== null ? coords.speed * 3.6 : 0;
    const alt = coords.altitude !== null ? coords.altitude : 0;
    const timestamp = new Date().toISOString();

    // GPS Status update
    document.getElementById('gps-led').classList.add('locked');
    document.getElementById('gps-status-text').innerText = "GPS LOCKED";
    document.getElementById('gps-accuracy').innerText = `(${Math.round(coords.accuracy)}m)`;

    // Fetch weather once on first fix
    if (!weatherFetched && coords.latitude && coords.longitude) {
      fetchWeather(coords.latitude, coords.longitude);
      weatherFetched = true;
    }

    // Altitude calculations
    if (alt !== 0) {
      if (minAlt === null || alt < minAlt) minAlt = alt;
      if (maxAlt === null || alt > maxAlt) maxAlt = alt;
      if (lastAlt !== null && alt > lastAlt) {
        totalGain += (alt - lastAlt);
      }
      lastAlt = alt;
      document.getElementById('alt-curr').innerText = Math.round(alt) + ' m';
      document.getElementById('alt-min').innerText = Math.round(minAlt) + ' m';
      document.getElementById('alt-max').innerText = Math.round(maxAlt) + ' m';
      document.getElementById('alt-gain').innerText = Math.round(totalGain) + ' m';
    }

    // Averages calculation
    speedBuffer.push(speedKmh);
    const overallAvg = speedBuffer.reduce((a, b) => a + b, 0) / speedBuffer.length;
    const movingSpeeds = speedBuffer.filter(s => s > 2);
    const movingAvg = movingSpeeds.length > 0 ? movingSpeeds.reduce((a, b) => a + b, 0) / movingSpeeds.length : 0;

    document.getElementById('overall-avg').innerText = overallAvg.toFixed(1);
    document.getElementById('moving-avg').innerText = movingAvg.toFixed(1);

    // Pace Indicator logic
    const paceDisp = document.getElementById('pace-display');
    const paceArrow = document.getElementById('pace-arrow');
    const paceText = document.getElementById('pace-text');
    const diff = speedKmh - targetSpeed;

    if (speedKmh < 3) {
      paceDisp.style.color = '#9ca3af';
      paceArrow.innerText = '—';
      paceText.innerText = 'IDLE';
    } else if (diff >= -5 && diff <= 5) {
      paceDisp.style.color = '#22c55e';
      paceArrow.innerText = '➔';
      paceText.innerText = 'ON PACE';
    } else if (diff > 5) {
      paceDisp.style.color = '#38bdf8';
      paceArrow.innerText = '▲';
      paceText.innerText = 'AHEAD';
    } else {
      paceDisp.style.color = '#ef4444';
      paceArrow.innerText = '▼';
      paceText.innerText = 'BEHIND';
    }

    // Push to GPX buffer
    gpxPoints.push({ lat: coords.latitude, lon: coords.longitude, alt: alt, speed: speedKmh, time: timestamp });
    document.getElementById('log-count').innerText = `Recorded Points: ${gpxPoints.length}`;

  }, err => {
    document.getElementById('gps-led').classList.remove('locked');
    document.getElementById('gps-status-text').innerText = "GPS ERROR";
  }, geoOptions);

  function clearLogs() {
    gpxPoints = [];
    document.getElementById('log-count').innerText = `Recorded Points: 0`;
    alert("GPX log buffer cleared.");
  }

  function exportGPX() {
    if (gpxPoints.length === 0) {
      alert("No GPS points recorded yet.");
      return;
    }
    let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="ADV Mission Control">\n  <trk>\n    <name>ADV Ride Track</name>\n    <trkseg>\n`;
    gpxPoints.forEach(p => {
      gpx += `      <trkpt lat="${p.lat}" lon="${p.lon}">\n        <ele>${p.alt}</ele>\n        <time>${p.time}</time>\n        <extensions><speed>${p.speed}</speed></extensions>\n      </trkpt>\n`;
    });
    gpx += `    </trkseg>\n  </trk>\n</gpx>`;

    const blob = new Blob([gpx], { type: 'application/gpx+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `adv-track-${new Date().toISOString().slice(0,10)}.gpx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
</script>
</body>
</html>
